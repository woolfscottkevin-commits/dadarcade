:root{
  --paper:#fffdf6; --ink:#1f2430; --muted:#5b6570; --line:#e8e2d2; --card:#ffffff;
  --sky1:#57b8ff; --sky2:#dff3ff; --grass:#3a9d4a; --grassdk:#2d6a2f;
  --tricks:#e67e22; --builds:#3a9d4a; --survival:#2f7fe0; --redstone:#d64545; --back:#7b4fc9; --front:#3a4a5c;
  --gold:#f2c230; --c:var(--grass);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;line-height:1.5;padding-inline:0}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}

<body>
<header class="top"><div class="wrap"><a class="logo" href="#home"><i></i>Layer by Layer</a><a class="backda" href="/">← Dad Arcade</a><nav class="nav" id="nav"></nav></div></header>
<div id="app"><div class="wrap" style="padding-block:60px"><p>Loading Layer by Layer...</p></div></div>
<p class="foot" id="foot"></p>

<script>
(() => {
let COLORS = {}, PARTNAME = {}, PARTNUM = {}, PARTNAV = {};
const LABELS = {pro: 'PRO TIP', warn: 'WATCH OUT', know: 'DID YOU KNOW?', start: 'START HERE'};
const app = document.getElementById('app');
let BOOK = null, ATLAS = null, current = null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nav(active){
  const items = [['home','Home','#3a4a5c']].concat(BOOK.parts.map(p => ['part/'+p.key, p.nav, p.color]));
  document.getElementById('nav').innerHTML = items.map(([h,l,c]) => `<a href="#${h}" style="--nc:${c}" aria-current="${active===h}">${esc(l)}</a>`).join('');
}
const recs = () => BOOK.records;
const byAnchor = a => recs().findIndex(r => r.anchor === a);
const partLabel = key => PARTNUM[key] ? `Part ${PARTNUM[key]} · ${PARTNAME[key]}` : PARTNAME[key];
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;
function pagesOf(part){ return recs().map((r,i)=>[r,i]).filter(([r]) => r.part === part && r.kind !== 'divider'); }

function linkRefs(html){
  // "page §circles" becomes a link to that page, labeled with its print page number
  return String(html).replace(/page §(\w+)/g, (m, a) => {
    const i = byAnchor(a); const pg = BOOK.anchors[a];
    if (i < 0) return pg ? `page ${pg} of the printed book` : 'the printed book';
    return `<a href="#p/${i}">page ${pg}</a>`;
  });
}
function fixBody(html){
  html = linkRefs(html);
  html = html.replace(/<table class="data"/g, '<div class="tscroll"><table class="data"').replace(/<\/table>/g, '</table></div>');
  return html;
}

function home(){
  nav('home');
  const c = BOOK.cover;
  const words = BOOK.title.toUpperCase().split(' ');
  const t1 = words.slice(0, Math.ceil(words.length/2)).join(' '), t2 = words.slice(Math.ceil(words.length/2)).join(' ');
  const big = recs().map((r,i)=>[r,i]).filter(([r]) => r.kind === 'build' && !r.mini);
  const partCards = BOOK.parts.filter(p => p.num).map(p => {
    const d = recs().find(r => r.kind === 'divider' && r.part === p.key);
    return `<a class="part" href="#part/${p.key}" style="--pc:${p.color}"><span class="n">${String(p.num).padStart(2,'0')}</span><h2>${esc(p.title)}</h2><p>${esc(d ? d.sub : '')}</p>${d ? `<img src="${d.img}" alt="">` : ''}</a>`;
  }).join('');
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div class="eyebrow">${esc(BOOK.subtitle.toUpperCase())}</div>
    <h1>${esc(t1)}<br>${esc(t2)}</h1>
    <div class="pill">${esc(BOOK.tagline)}</div>
    <div class="scene"><img class="s1" src="${c.wizard}" alt="Wizard's Tower build"><img class="s2" src="${c.castle}" alt="Castle Gatehouse build"><img class="s3" src="${c.rocket}" alt="Rocket Launch Pad build"></div>
  </div></section>
  <div class="wrap">
    <p class="intro">10 big builds and 4 mini builds, with a plan for every layer. Spin each build in 3D. Explore the Master Build Showcase and the Top 10 Coolest Things to Do. Get Survival Hints and Redstone Workshop gadgets for Bedrock Edition.</p>
    <div class="parts">${partCards}</div>
    <h2 class="sec">Pick a build</h2>
    <div class="grid-builds">${big.map(([r,i]) => buildCard(r,i)).join('')}</div>
  </div>`;
}
function buildCard(r, i){
  const d = r.diff || 1;
  const label = r.number ? `${r.number}. ${r.title}` : r.title;
  return `<a class="bcard" href="#p/${i}"><div class="art"><img src="${r.hero}" alt="" loading="lazy"></div><div class="t"><b>${esc(label)}</b><span class="pips" aria-label="Difficulty ${d} of 3">${[0,1,2].map(k=>`<i class="${k<d?'':'off'}"></i>`).join('')}</span></div></a>`;
}

function partView(part){
  nav('part/'+part);
  const color = COLORS[part];
  const d = recs().find(r => r.kind === 'divider' && r.part === part);
  const list = pagesOf(part);
  let top;
  if (d) top = `<section class="divider" style="--c:${part === 'showcase' ? '#1f2340' : color}"><div class="wrap"><div><div class="num">${d.num}</div><h1>${esc(d.title)}</h1><p>${esc(d.sub)}</p></div><img src="${d.img}" alt=""></div></section>`;
  else top = `<section class="band" style="--c:${color}"><div class="wrap"><div class="kicker">${esc(BOOK.title)}</div><h1>${esc(PARTNAME[part])}</h1></div></section>`;
  let body;
  if (part === 'builds') {
    const big = list.filter(([r]) => r.kind === 'build' && !r.mini), mini = list.filter(([r]) => r.mini);
    body = `<div class="grid-builds">${big.map(([r,i]) => buildCard(r,i)).join('')}</div><h2 class="sec">Mini builds</h2><div class="grid-builds">${mini.map(([r,i]) => buildCard(r,i)).join('')}</div>`;
  } else if (part === 'zone') {
    body = checklist(recs().find(r => r.kind === 'checklist'));
  } else {
    body = `<div class="toc" style="--c:${color}">${list.map(([r,i],k) => `<a href="#p/${i}"><span class="k">${r.kind === 'top10' ? '#' + r.item.rank : (part === 'top10' ? '★' : k+1)}</span>${esc(r.title)}</a>`).join('')}</div>`;
  }
  app.innerHTML = top + `<main class="wrap" style="--c:${color}">${body}</main>`;
  if (part === 'zone') wireChecklist();
  window.scrollTo(0,0);
}

function checklist(r){
  const row = (key, label) => `<li><input type="checkbox" id="ck-${key}" data-k="${key}"><label for="ck-${key}">${esc(label)}</label></li>`;
  return `<div class="read"><p class="lead">Check off each build when you finish it. Your checks are saved on this device.</p>
  <div class="cols"><div class="card"><h2>Big builds</h2><ul class="check">${r.builds.map(b => row(b.fn, `${b.number}. ${b.title}`)).join('')}</ul>
    <h2 style="margin-top:14px">Mini builds</h2><ul class="check">${r.minis.map(b => row(b.fn, b.title)).join('')}</ul></div>
  <div class="card"><h2>Master builder challenges</h2><ul class="check">${r.challenges.map((c,i) => `<li><input type="checkbox" id="ch-${i}" data-k="ch${i}"><label for="ch-${i}">${linkRefs(esc(c))}</label></li>`).join('')}</ul></div></div></div>`;
}
function wireChecklist(){
  const st = store.get('lbl-check', {});
  app.querySelectorAll('.check input').forEach(el => { el.checked = !!st[el.dataset.k]; el.addEventListener('change', () => { st[el.dataset.k] = el.checked; store.set('lbl-check', st); }); });
}

function pager(i){
  const list = recs().map((r,k)=>[r,k]).filter(([r]) => r.kind !== 'divider');
  const pos = list.findIndex(([,k]) => k === i);
  const prev = list[pos-1], next = list[pos+1];
  const name = r => r.number ? `${r.number}. ${r.title}` : r.title;
  return `<nav class="pager">${prev ? `<a class="btn ghost" href="#p/${prev[1]}">← <span>${esc(name(prev[0]))}</span></a>` : '<span></span>'}${next ? `<a class="btn" style="--c:${COLORS[next[0].part]}" href="#p/${next[1]}"><span>${esc(name(next[0]))}</span> →</a>` : ''}</nav>`;
}

function page(i){
  const r = recs()[i]; if (!r) return home();
  if (r.kind === 'divider') { location.hash = 'part/' + r.part; return; }
  if (r.kind === 'checklist') { location.hash = 'part/zone'; return; }
  nav('part/'+r.part);
  const c = COLORS[r.part];
  const title = r.kind === 'build' && r.number ? `${r.number}. ${r.title}` : r.title;
  const band = `<section class="band" style="--c:${c}"><div class="wrap"><div class="kicker">${esc(partLabel(r.part))}</div><h1>${esc(title)}</h1></div></section>`;
  if (r.kind === 'build') return buildPage(r, i, band);
  if (r.kind === 'feature') return featurePage(r, i);
  if (r.kind === 'top10') return top10Page(r, i, band);
  app.innerHTML = band + `<main class="wrap read" style="--c:${c}">${fixBody(r.body)}${pager(i)}</main>`;
  window.scrollTo(0,0);
}

  const body = (f.body || []).map(t => `<p>${linkRefs(esc(t))}</p>`).join('');

  const links = (f.links || []).map(([t,u]) => `<a class="btn" style="--c:#1f2340" href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('');

      <div class="wrap ftitle"><span class="kick">${esc(f.kicker)}</span><h1>${esc(f.headline)}</h1><p>${esc(f.deck)}</p></div>
      <div class="fimg"><div class="relbox"><img src="${r.img}" alt="Illustration for ${esc(f.headline)}">${tags}</div></div>
      <div class="illus">${esc(r.caption)}</div>

    <main class="wrap read fbody">
      ${stats ? `<div class="fstats">${stats}</div>` : ''}

      ${cards ? `<div class="chals">${cards}</div><div class="lesson">${esc(f.lesson)}</div>` : ''}
      ${habits}
      ${f.record ? `<div class="record"><b>WORLD RECORD</b> ${esc(f.record)}</div>` : ''}
      ${f.playable ? `<div class="playable"><b>Can you play it?</b> ${esc(f.playable)}</div>` : ''}
      ${tryPanel}
      ${links ? `<div class="flinks"><p class="askadult">Ask a grown-up before you visit a link.</p>${links}</div>` : ''}
      ${srcs ? `<p class="fsrc">Facts checked September 2026. Sources: ${srcs}</p>` : ''}
      ${pager(i)}
    </main></article>`;
  window.scrollTo(0,0);
}

    <div class="card" style="margin-top:10px"><h3 style="color:var(--c)">Rare mobs</h3><p style="margin:0">${esc(t.rare)}</p></div></div>
    <div><h2>Myths, busted</h2>${t.myths.map(([q,a]) => `<div class="myth"><b>${esc(q)}</b> ${esc(a)}</div>`).join('')}</div></div>` : '';

      <div><h2>What you need</h2><div class="pills">${t.need.map(n => `<span class="pill2">${esc(n)}</span>`).join('')}</div>
        <div class="tip know"><b class="t">DID YOU KNOW?</b><b>${esc(t.wow_title)}.</b> ${esc(t.wow)}</div>
        ${t.note ? `<div class="tip ${t.note_kind}"><b class="t">${LABELS[t.note_kind]}</b><b>${esc(t.note_title)}.</b> ${linkRefs(esc(t.note))}</div>` : ''}</div></div>
    ${pager(i)}</main>`;

// ------------------------------------------------ 3D build viewer
async function loadAtlas(){
  if (ATLAS) return ATLAS;
  ATLAS = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'img/atlas.webp'; });
  return ATLAS;
}
const dataCache = {};
async function loadBuild(fn){
  if (!dataCache[fn]) { const r = await fetch(`data/${fn}.json`); dataCache[fn] = await r.json(); }
  return dataCache[fn];
}

async function buildPage(r, i, band){
  const c = COLORS.builds;
  app.innerHTML = band + `<main class="wrap read" style="--c:${c}">
    ${r.stats}
    <p class="lead">${esc(r.blurb)}</p>
    <div class="bench">
      <section class="panel" aria-label="3D preview">
        <div class="ph"><h3>3D preview</h3><div class="tools">
          <button class="ib" id="rotL" aria-label="Turn left">⟲</button><button class="ib" id="rotR" aria-label="Turn right">⟳</button>
          <button class="ib" id="zin" aria-label="Zoom in">+</button><button class="ib" id="zout" aria-label="Zoom out">−</button></div></div>
        <div class="view" id="view"><canvas id="cv"></canvas></div>
        <div class="slider"><span class="lname" id="lname">…</span><input type="range" id="layer" min="0" max="0" value="0" aria-label="Show build up to this layer"></div>
        <div class="hint">Drag the picture sideways to turn the build. Move the slider to watch it grow.</div>
      </section>
      <section class="panel" aria-label="Layer plan">
        <div class="ph"><h3 id="ptitle">Layer plan</h3><span class="cnt" id="pcnt"></span><div class="tools"><button class="ib" id="lprev" aria-label="Previous layer">‹</button><button class="ib" id="lnext" aria-label="Next layer">›</button></div></div>
        <div class="planbox" id="plan"></div>
        <div class="hint">North is at the top. Count squares with the numbers on the edges. The symbols are explained on the “How to Use This Book” page.</div>
      </section>
    </div>
    ${r.tips ? `<div class="cols" style="margin-top:16px">${r.tips}</div>` : ''}
    ${r.challenge ? `<div class="tip know" style="border-style:dashed"><b class="t" style="background:${c}">MAKE IT YOURS</b>${esc(r.challenge)}</div>` : ''}
    <h2 style="margin-top:26px">Block list</h2><p style="color:var(--muted);font-weight:700;margin:0">Tap a block when you've gathered it.</p>
    <div class="mats" id="mats"></div>
    ${pager(i)}
  </main>`;
  window.scrollTo(0,0);
  const token = current = {};
  const [data, atlas] = await Promise.all([loadBuild(r.fn), loadAtlas()]);
  if (current !== token) return;
  viewer(data, atlas, token);
  const key = 'lbl-mats-' + r.fn; const got = store.get(key, {});
  const mats = document.getElementById('mats');
  mats.innerHTML = data.mats.map((m, k) => `<label class="mat ${got[m.name]?'got':''}"><input type="checkbox" data-n="${esc(m.name)}" ${got[m.name]?'checked':''}><img src="${m.icon}" alt=""><span class="nm">${m.name === 'Water Bucket' ? 'Water' : esc(m.name)}</span><span class="n">${m.name === 'Water Bucket' ? plural(m.n, 'bucket') : '×' + m.n}${m.st?`<small>${m.st}</small>`:''}</span></label>`).join('');
  mats.querySelectorAll('input').forEach(el => el.addEventListener('change', () => { got[el.dataset.n] = el.checked; el.closest('.mat').classList.toggle('got', el.checked); store.set(key, got); }));
}

function viewer(data, atlas, token){
  const [SW, SH, COLS] = BOOK.spr, [A, BH, H] = BOOK.proj;
  const cv = document.getElementById('cv'), view = document.getElementById('view'), ctx = cv.getContext('2d');
  const slider = document.getElementById('layer'), lname = document.getElementById('lname');
  const G = data.groups;
  slider.max = G.length; slider.value = G.length;
  let rot = 0, zoom = 1;
  // precompute each rotation: cells + ground, sorted, with bounds
  const R = [0,1,2,3].map(r => {
    const a = data.rots[r], cells = [], occ = new Set();
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for (let k = 0; k < a.length; k += 5){
      const c = {x:a[k], y:a[k+1], z:a[k+2], s:a[k+3], t:a[k+4]}; cells.push(c); occ.add(c.x+','+c.y+','+c.z);
      x0=Math.min(x0,c.x); x1=Math.max(x1,c.x); z0=Math.min(z0,c.z); z1=Math.max(z1,c.z);
    }
    for (let x = x0-1; x <= x1+1; x++) for (let z = z0-1; z <= z1+1; z++) if (!occ.has(x+',-1,'+z)) cells.push({x, y:-1, z, s:BOOK.grass, t:BOOK.grass, g:1});
    cells.sort((p,q) => (p.x+p.y+p.z)-(q.x+q.y+q.z) || p.y-q.y || p.x-q.x);
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for (const c of cells){ const sx=(c.x-c.z)*A, sy=(c.x+c.z)*BH-c.y*H; minx=Math.min(minx,sx); maxx=Math.max(maxx,sx+SW); miny=Math.min(miny,sy); maxy=Math.max(maxy,sy+SH); }
    return {cells, minx, maxx, miny, maxy};
  });
  function draw(){
    if (current !== token) return;
    const dpr = window.devicePixelRatio || 1, w = view.clientWidth, h = view.clientHeight;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const fin = +slider.value >= G.length;
    const g = fin ? G[0] : G[+slider.value], top = fin ? 1e9 : g.y1;
    const V = R[rot], bw = V.maxx - V.minx, bh = V.maxy - V.miny;
    const sc = Math.min(w*.92/bw, h*.92/bh) * zoom;
    ctx.setTransform(dpr*sc, 0, 0, dpr*sc, dpr*(w - bw*sc)/2 - V.minx*dpr*sc, dpr*(h - bh*sc)/2 - V.miny*dpr*sc);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    for (const c of V.cells){
      if (c.y > top) continue;
      const idx = c.y === top ? c.t : c.s; if (idx < 0) continue;
      ctx.drawImage(atlas, (idx % COLS)*SW, Math.floor(idx/COLS)*SH, SW, SH, (c.x-c.z)*A, (c.x+c.z)*BH - c.y*H, SW, SH);
    }
    const reps = g.y1 > g.y0 ? ` <span class="rep">build ×${g.y1-g.y0+1}</span>` : '';
    lname.textContent = fin ? 'Finished' : g.name;
    document.getElementById('ptitle').innerHTML = (fin ? 'Start with ' : '') + esc(g.name) + reps;
    document.getElementById('pcnt').textContent = `${plural(g.n, 'block')}${g.y1>g.y0?' each':''}`;
    document.getElementById('plan').innerHTML = g.svg;
  }
  let planFor = -1;
  const redraw = () => requestAnimationFrame(draw);
  slider.addEventListener('input', redraw);
  document.getElementById('rotL').onclick = () => { rot = (rot+3)%4; redraw(); };
  document.getElementById('rotR').onclick = () => { rot = (rot+1)%4; redraw(); };
  document.getElementById('zin').onclick = () => { zoom = Math.min(3, zoom*1.25); redraw(); };
  document.getElementById('zout').onclick = () => { zoom = Math.max(.6, zoom/1.25); redraw(); };
  document.getElementById('lprev').onclick = () => { slider.value = +slider.value >= G.length ? 0 : Math.max(0, +slider.value-1); redraw(); };
  document.getElementById('lnext').onclick = () => { slider.value = +slider.value >= G.length ? 1 : Math.min(G.length, +slider.value+1); redraw(); };
  let dragX = null;
  view.addEventListener('pointerdown', e => { dragX = e.clientX; view.setPointerCapture(e.pointerId); });
  view.addEventListener('pointermove', e => { if (dragX === null) return; const dx = e.clientX - dragX; if (Math.abs(dx) > 60){ rot = (rot + (dx > 0 ? 3 : 1)) % 4; dragX = e.clientX; redraw(); } });
  view.addEventListener('pointerup', () => dragX = null); view.addEventListener('pointercancel', () => dragX = null);
  new ResizeObserver(redraw).observe(view);
  redraw();
}

function route(){
  const h = location.hash.slice(1) || 'home';
  current = null;
  if (h.startsWith('p/')) return page(+h.slice(2));
  if (h.startsWith('part/')) return partView(h.slice(5));
  home(); window.scrollTo(0,0);
}
document.addEventListener('keydown', e => {
  if (!location.hash.startsWith('#p/') || e.target.closest('input')) return;
  const btns = app.querySelectorAll('.pager a');
  if (e.key === 'ArrowRight' && btns.length) btns[btns.length-1].click();
  if (e.key === 'ArrowLeft' && btns.length > 1) btns[0].click();
});
fetch('data/book.json').then(r => r.json()).then(b => {
  BOOK = b;
  for (const p of b.parts) { COLORS[p.key] = p.color; PARTNAME[p.key] = p.title; PARTNUM[p.key] = p.num; PARTNAV[p.key] = p.nav; }
  document.title = b.title;
  document.getElementById('foot').textContent = b.disclaimer + ' ' + b.edition;
  window.addEventListener('hashchange', route); route();
}).catch(() => { app.innerHTML = '<div class="wrap" style="padding-block:40px"><p>The book data could not load. Refresh the page to try again.</p></div>'; });
})();
</script>
