        },
        quote: {
          text: "It always seems impossible until it's done.",
          question: "What do you think he meant by that?",
          author: "Nelson Mandela",
          context: "Nelson Mandela spent 27 years in prison in South Africa for standing against unfair laws that separated people by the colour of their skin. After he was freed, he became the country's president. He said this about big changes that look far too hard right up until someone finally manages them.",

          us: { question: "Which US state is known as the 'Sunshine State'?", choices: ["California", "Florida", "Arizona", "Hawaii"], correctIndex: 1, answer: "Florida", context: "Florida is a long peninsula in the southeast, with the Atlantic Ocean on one side and the Gulf on the other. It is famous for beaches, alligators, and rockets launching from Cape Canaveral.", funFact: "Florida has more thunderstorms than any other US state." },

        thisDayInHistory: {
          year: "1963", event: "Martin Luther King Jr. gave his 'I Have a Dream' speech in Washington, D.C.",
          question: "Something famous was said on this date. Can you guess what kind of event it was?",
          context: "More than 250,000 people came together to ask for fair treatment for all Americans. Dr. King stood on the steps of the Lincoln Memorial and described a future where children would be judged by their character rather than their skin colour. It became one of the most famous speeches ever given.",
        },
        riddle: { riddle: "I have keys but open no locks. I have space but no room. You can enter, but you cannot go inside. What am I?", answer: "A keyboard", explanation: "It plays on words: a keyboard has keys, a space bar, and an enter key — but none of them work like the real thing." },

          { headline: "Scientists spot a new kind of glowing deep-sea jellyfish", summary: "A research submarine filmed a jellyfish that lights up in bright blue rings nearly two miles below the ocean surface. Scientists think the glow may help it startle predators.", question: "If you could design a glowing animal, what would yours look like?" },

          { emoji: "🐙", title: "Octopus blood is blue", fact: "Octopus blood uses copper to carry oxygen instead of iron like ours does. Copper turns blue when it grabs oxygen, so their blood looks blue instead of red. It also works better in very cold water." },

        jokes: [
          { setup: "Why did the scarecrow win an award?", punchline: "Because he was outstanding in his field!", level: "connor" },
          { setup: "What do you call a fish wearing a bowtie?", punchline: "Sofishticated.", level: "claire" },
        ],
        wyr: [
          { a: "Be able to talk to animals", b: "Be able to breathe underwater" },
          { a: "Have a pet dragon the size of a cat", b: "Have a pet elephant the size of a dog" },
          { a: "Always have to skip everywhere", b: "Always have to sing instead of speak" },
          { a: "Explore the deepest ocean", b: "Explore the far side of the Moon" },
        ],
        meta: { schemaVersion: 2 },
      },
    };
    const realFetch = window.fetch;
    window.fetch = (url, opts) => {
      const u = String(url);
      if (u.includes("past=1")) return Promise.resolve(new Response(JSON.stringify({ days: [{ date: "2026-08-27", headline: "Yesterday" }] }), { headers: { "Content-Type": "application/json" } }));
      if (u.includes("/api/morning-drive")) {
        if (opts && opts.method === "POST") return Promise.resolve(new Response(JSON.stringify({ ok: true }), { headers: { "Content-Type": "application/json" } }));
        return Promise.resolve(new Response(JSON.stringify(FAKE), { headers: { "Content-Type": "application/json" } }));
      }
      return realFetch(url, opts);
    };
  </script>
</head>
<body>
  <a class="back-link" href="/" aria-label="Back to Dad Arcade">← Dad Arcade</a>
  <main id="app" aria-live="polite">
    <header class="app-header">
      <h1>Morning Drive</h1>
      <p class="app-sub" id="app-date"></p>
      <div class="score-row">
        <span class="score-badge score-claire">Claire <strong id="score-claire">0</strong> / 5 ⭐</span>
        <span class="score-badge score-connor">Connor <strong id="score-connor">0</strong> / 5 ⭐</span>
      </div>
      <div id="read-only-banner" class="read-only-banner" hidden>
        <span>Reviewing <strong id="ro-date"></strong></span>
        <button type="button" id="back-to-today">Back to today</button>
      </div>
    </header>
    <div id="status" class="status">Loading…</div>
    <div id="error" class="error" hidden></div>
    <div id="sections" class="sections" hidden></div>
  </main>
  <button type="button" id="past-days-btn" class="past-pill">📅 Past Days</button>
  <div id="past-sheet" class="past-sheet" hidden role="dialog" aria-modal="true" aria-label="Past Days">
    <div class="past-card">
      <button type="button" class="past-close" aria-label="Close">×</button>
      <h2>Past Days</h2>
      <div id="past-list" class="past-list"></div>
    </div>
  </div>
  <script type="module" src="../main.js"></script>
</body>
</html>
